name: Sync country data

on:
  schedule:
    - cron: '0 3 * * 5'   # venerdì 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge upstream + local -> it.json
        run: node scripts/merge-country.js it

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv/raw/countries/it.json
          git diff --staged --quiet || git commit -m "chore: sync it.json (upstream + local overrides)"
          git pull --rebase origin main
          git push origin main
