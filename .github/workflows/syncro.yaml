name: Sync fork + country data

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Config git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aggiungi remote upstream
        run: |
          git remote add upstream https://github.com/famelack/famelack-data.git || true
          git fetch upstream main

      - name: Merge upstream mantenendo i miei file
        run: |
          git merge upstream/main --no-edit -X ours || true

      - name: Merge it.json (upstream fresco + it.local.json)
        run: node scripts/merge-country.js it

      - name: Commit & push
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync upstream + aggiornamento it.json"
          git push origin main
