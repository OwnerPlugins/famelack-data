name: Diff local vs upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diff
        run: node scripts/diff-local-vs-upstream.js

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv/raw/countries/it.local.json it.custom.report.txt
          git diff --staged --quiet || git commit -m "chore: ridotto it.local.json ai soli override + report"
          git pull --rebase origin main
          git push origin main
